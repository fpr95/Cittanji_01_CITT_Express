<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Personajes - CITT Express</title>
<style>
  :root{ --ink:#1b1f2e; --muted:#5d6480; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#dfe6f0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  canvas{display:block}

  #top{position:fixed;top:0;left:0;right:0;padding:14px 20px;z-index:5;
    display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;
    background:linear-gradient(rgba(223,230,240,.95),rgba(223,230,240,0))}
  h1{margin:0;font-size:17px;letter-spacing:.2px}
  #hint{font-size:13px;color:var(--muted)}

  #names{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:5;
    padding:0 0 18px;pointer-events:none}
  .name{flex:1;text-align:center}
  .name b{display:block;font-size:15px}
  .name span{font-size:11.5px;color:var(--muted)}

  #controls{position:fixed;top:12px;right:20px;z-index:6;display:flex;gap:8px}
  button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:1px solid rgba(0,0,0,.14);background:#fff;color:var(--ink);
    border-radius:9px;padding:7px 13px}
  button:hover{background:#f0f4fa}
  button.on{background:var(--ink);color:#fff;border-color:transparent}
</style>
</head>
<body>
  <div id="top">
    <h1>Personajes</h1>
    <span id="hint">Arrastra para girar la cámara · rueda para acercar</span>
  </div>
  <div id="controls">
    <button id="spin" class="on">Girar</button>
    <button id="bg">Fondo</button>
  </div>
  <div id="names"></div>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
